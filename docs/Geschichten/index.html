<script>
const $=s=>document.querySelector(s),M=$('#m'),SH=$('#sheet');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOT=V.length,COV=(()=>{const L=new Set(V.map(v=>v[1].toLowerCase())),u=new Set();S.forEach(s=>Object.keys(s.w).forEach(k=>u.add(k.toLowerCase())));return [...u].filter(k=>L.has(k)).length})();$('#sub').textContent=S.length+' kleine Geschichten · '+COV+' von '+TOT+' Wörtern schon dabei. Tippe auf ein markiertes Wort für die Bedeutung.';$('#pb').style.width=(100*COV/TOT).toFixed(1)+'%';

const EN={e:'**-e** = the ending for **ich** (I). Example: ich heiße, ich komme.',st:'**-st** = the ending for **du** (you). Example: du kommst.',t:'**-t** = the ending for **er / sie / es** (he, she, it) and **ihr** (you all). Example: er kommt.',en:'**-en** = the ending for **wir / sie / Sie** (we, they, you formal). It is also the infinitive.',n:'**-n** = the ending for **wir / sie / Sie** after verbs like sammeln or wandern.',et:'**-et** = the ending for **er / sie / es / ihr** when the stem ends in -t or -d. Example: er arbeitet.',est:'**-est** = the ending for **du** when the stem ends in -t or -d. Example: du arbeitest.',te:'**-te** = past tense (Präteritum) for ich / er / sie / es. Example: ich wohnte.',ten:'**-ten** = past tense (Präteritum) for wir / sie / Sie.'};
const isV=w=>!w[0]&&(w[4]==='v'||/^to /.test(w[2]||''));
const vb=(sf,lem,w)=>{if(!isV(w))return esc(sf);const a=sf.toLowerCase(),st=/en$/.test(lem)?lem.slice(0,-2):/n$/.test(lem)?lem.slice(0,-1):'';if(a===lem||st.length<2||!a.startsWith(st))return esc(sf);const e=a.slice(st.length);if(!e||!EN[e])return esc(sf);return esc(sf.slice(0,st.length))+'<span class="end" data-e="'+e+'">'+esc(sf.slice(st.length))+'</span>'};
const N_P={m:'Peter',f:'Anna'};
const T1=[["Woher kommst du, {N}?","Woher kommen Sie?","Where are you from?"],["Wo wohnst du jetzt, {N}?","Wo wohnen Sie jetzt?","Where do you live now?"],["Was machst du beruflich, {N}?","Was machen Sie beruflich?","What is your job?"],["Hast du Familie, {N}?","Haben Sie Familie?","Do you have a family?"],["Was machst du in deiner Freizeit, {N}?","Was machen Sie in Ihrer Freizeit?","What do you do in your free time?"]];
const PB=[["Was meinst du, {N}?","Was meinen Sie dazu?","What do you think?"],["Was hältst du davon, {N}?","Was halten Sie davon?","What do you think of it?"],["Ich schlage vor, dass wir … Was hältst du davon, {N}?","Ich schlage vor, dass wir … Was halten Sie davon?","I suggest that we …"],["Da stimme ich dir zu.","Da stimme ich Ihnen zu.","I agree."],["Da bin ich anderer Meinung, weil …","Da bin ich anderer Meinung, weil …","I disagree, because …"],["Wie meinst du das, {N}?","Wie meinen Sie das?","What do you mean?"],["Entschuldige, ich habe dich nicht verstanden.","Entschuldigung, ich habe Sie nicht verstanden. Können Sie das wiederholen?","I did not understand. Could you repeat that?"],["Moment, ich denke kurz nach.","Darf ich kurz überlegen?","Let me think for a moment."],["Gute Idee! Lass uns das so machen.","Das ist eine gute Idee. Wir machen das so.","Good idea! Let's do it that way."],["Danke, {N}, das war meine Meinung.","Danke, das war meine Meinung.","Thank you, that was my opinion."],["Darf ich dazu etwas sagen?","Darf ich dazu etwas sagen?","May I add something?"]];
const exHtml=(s,k)=>{
  const rows=[];
  const add=(d,sie,en)=>rows.push([d.replace(/\{N\}/g,'Peter'),d.replace(/\{N\}/g,'Anna'),sie,en]);
  if(k<6) T1.forEach(r=>add(r[0],r[1],r[2]));
  PB.forEach(r=>add(r[0],r[1],r[2]));
  const cells=rows.map(([m,f,e,en])=>`<tr><td>${esc(m)}</td><td>${esc(f)}</td><td>${esc(e)}<small>${esc(en)}</small></td></tr>`).join('');
  const qc=(a,q)=>(q?`<small class="qq">${esc(q)}</small>`:'')+esc(a);
  const pvRows=(s.x.pv||[]).map(([m,f,e,en,qm,qf,qe])=>`<tr><td>${qc(m,qm)}</td><td>${qc(f,qf)}</td><td>${qc(e,qe)}<small>${esc(en)}</small></td></tr>`).join('');
  const extra=(s.x.sp||[]).map(([m,f,e,en])=>`<tr><td>${esc(m)}</td><td>${esc(f)}</td><td>${esc(e)}<small>${esc(en)}</small></td></tr>`).join('');
  const sc=s.x.sc.map(t=>`<li>${esc(t)}</li>`).join('');
  const q=s.x.q.map(t=>`<li>${esc(t)}</li>`).join('');
  return `<h3>Sprechen: Sätze für Partner und Prüfer</h3><p class="xn">Peter und Anna: immer du · Prüfer/in: immer Sie. Die Zeile lesen, laut sprechen.</p><div class="xw"><table class="xt"><thead><tr><th>Peter (du)</th><th>Anna (du)</th><th>Prüfer/in (Sie)</th></tr></thead><tbody>${cells}${extra}${pvRows}</tbody></table></div><h3>Schreiben: Checkliste</h3><ol class="xl">${sc}</ol><h3>Selbstcheck (laut beantworten)</h3><ul class="xl">${q}</ul>`;
};
function story(id){const k=S.findIndex(s=>s.id===id);if(k<0)return list();const s=S[k];
 const rend=raw=>{const re=/\[\[(.+?)::(.+?)\]\]|\{([^{}|]+)(?:\|([^{}]+))?\}|==(.+?)==/g;let o='',i=0,m;while((m=re.exec(raw))){o+=esc(raw.slice(i,m.index));if(m[1]!==undefined){o+=`<span class="gw" data-n="${encodeURIComponent(m[2])}" tabindex="0">${rend(m[1])}</span>`}else if(m[5]!==undefined){o+=`<span class="ex">${rend(m[5])}</span>`}else{const lem=(m[4]||m[3]).trim().toLowerCase(),w=s.w[lem]||['','','','',''];o+=`<span class="hw a-${w[0]||(isV(w)?'v':'no')}" data-l="${esc(lem)}">${vb(m[3],lem,w)}</span>`}i=re.lastIndex}return o+esc(raw.slice(i))};
 const body=s.s.map(([d,e,l])=>l==='§'?`<div class="sec"><b>${esc(d)}</b><span>${esc(e)}</span></div>`:`<div class="sn">${l?`<span class="pv pv-${PVC[l]||0}">${esc(l)}</span>`:''}<div class="de">${rend(d)}</div><div class="en">${esc(e)}</div></div>`).join('');
 const rm=s.r.length?`<h3>Nützliche Sätze für Sprechen und Schreiben</h3><div class="rm">${s.r.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`:'';
 const tk=s.tk?`<h3>Deine Aufgabe</h3><div class="tk">${fmt(s.tk)}</div>`:'';
 const g=s.g.map(([t,x])=>`<div class="g"><b>${esc(t)}</b><p>${fmt(x)}</p></div>`).join('');
 const w=Object.values(s.w).sort((a,b)=>a[1].localeCompare(b[1],'de')).map(x=>`<a class="wi" href="../Wortschatz/index.html?q=${encodeURIComponent(x[1])}">${chip(x[0])}<b>${esc(x[1])}</b><span>${esc(x[2])}</span></a>`).join('');
 const p=S[k-1],n=S[k+1];

 const tip=$('#tip'),showTip=el=>{const mn=(s.mn&&s.mn[el.textContent])||MN[s.id+'|'+el.textContent]||MN[el.textContent];tip.innerHTML='<b>'+esc(el.textContent)+'</b>'+(mn?' <span class="mn">= '+esc(mn)+'</span>':'')+'<br>'+fmt(decodeURIComponent(el.dataset.n));tip.style.display='block';const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px'};
