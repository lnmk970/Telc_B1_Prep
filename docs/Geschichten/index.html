<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1a35"><title>Geschichten · telc B1</title>
<script>try{var t=localStorage.getItem("wsTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1a35;--ink:#16203a;--mut:#6b7590;--line:#e4e7f0;--bg:#f2f3f8;--card:#fff;--vb:#2f6bff;--ok:#0b6b4a;--chipbg:#eef1f8;--pbg:#0f1a35;--serif:Newsreader,Georgia,serif;--sans:Manrope,system-ui,sans-serif}
:root[data-theme=dark]{--bg:#0a1020;--line:#26335c;--chipbg:#1f2b50;--pbg:#3b5bdb;--mut:#9aa6c8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1020;--line:#26335c;--chipbg:#1f2b50;--pbg:#3b5bdb;--mut:#9aa6c8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--sans)}
:root[data-theme=dark] body{color:#e9edf9}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body{color:#e9edf9}}
.hero{background:radial-gradient(900px 300px at 85% -40%,#2c4592 0,transparent 70%),var(--navy);color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 36px}
.hin{max-width:760px;margin:0 auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav a,.tb{color:#c9d3f3;text-decoration:none;font:700 .9rem var(--sans);padding:8px 12px;border:1px solid #ffffff2e;border-radius:999px;background:#ffffff10;cursor:pointer}.tb{width:38px;height:38px;padding:0;display:grid;place-items:center}
.hero h1{font:600 clamp(1.8rem,6.5vw,2.6rem)/1.08 var(--serif);margin:20px 0 6px}.hero p{margin:0;color:#aab6dd;max-width:48ch}
.bar{height:8px;border-radius:99px;background:#ffffff26;margin-top:16px;overflow:hidden;max-width:420px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffbcd9,#ff7a3d);border-radius:99px}
main{max-width:760px;margin:-16px auto 70px;padding:0 12px}
.lv{font:700 .8rem var(--sans);color:var(--mut);margin:22px 6px 8px}
.card{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:14px;margin:0 0 9px;padding:13px 14px;text-decoration:none;box-shadow:0 1px 2px #0f1a3510,0 6px 18px -8px #0f1a3533}
.card b.n{flex:none;width:44px;height:44px;border-radius:12px;background:#eef1f8;display:grid;place-items:center;font:700 .85rem var(--sans);color:#2b3a67}
.card .t{font:600 1.18rem/1.2 var(--serif)}.card .s{color:#6b7590;font-size:.88rem;margin-top:1px}.card .c{margin-left:auto;text-align:right;color:#6b7590;font-size:.78rem;font-weight:700;white-space:nowrap}
.read{background:#fff;color:#16203a;border-radius:18px;padding:6px 18px 14px;box-shadow:0 10px 30px -12px #0f1a3544;margin-top:6px}
.read h2{font:600 1.7rem/1.15 var(--serif);margin:16px 0 2px}.read .te{color:#6b7590;margin:0 0 6px;font-weight:600}
.tools{display:flex;align-items:center;gap:12px;margin:10px 0 2px;font-weight:700;font-size:.85rem;color:#16203a}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.tg input{position:absolute;opacity:0}.tg span{width:36px;height:21px;border-radius:99px;background:#cfd5e5;position:relative;transition:.2s}.tg span::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}.tg input:checked+span{background:#2f6bff}.tg input:checked+span::after{left:17px}
.sn{padding:11px 0;border-top:1px solid #e4e7f0}.sn:first-of-type{border-top:0}.de{font:500 1.22rem/1.55 var(--serif)}.en{color:#0b6b4a;font-size:.93rem;margin-top:3px;font-weight:600}.noen .en{display:none}
.hw{border-bottom:2px dotted #2f6bff;cursor:pointer;border-radius:2px}.hw:hover,.hw.on{background:#2f6bff1f}.hw.a-der{border-color:#ff5a1f}.hw.a-die{border-color:#f58ab8}.hw.a-das{border-color:#98a2b3}
h3{font:700 .8rem var(--sans);color:var(--mut);margin:26px 6px 8px}
.g{background:#fff;color:#16203a;border-radius:14px;padding:12px 15px;margin:0 0 9px;box-shadow:0 1px 2px #0f1a3510}.g b{font-weight:800}.g p{margin:.2em 0 0;color:#2b3550}.g em{font-family:var(--serif);font-size:1.05em;color:#0f3fb0}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.wi{background:#fff;color:#16203a;border-radius:12px;padding:8px 10px;display:flex;gap:7px;align-items:baseline;font-size:.93rem;text-decoration:none;box-shadow:0 1px 2px #0f1a3510}.wi b{font:600 1.02rem var(--serif)}.wi span{color:#0b6b4a;margin-left:auto;text-align:right;font-weight:700;font-size:.82rem}
.chip{font:800 .68rem var(--sans);padding:1px 7px;border-radius:999px;flex:none}.i-der{background:#ff5a1f;color:#fff}.i-die{background:#ffc4dd;color:#6b1040}.i-das{background:#fff;color:#16203a;box-shadow:inset 0 0 0 1.5px #aab2c6}.i-no{background:#eef1f8;color:#6b7590}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.pn a{flex:1;text-align:center;text-decoration:none;color:#fff;background:var(--pbg);border-radius:12px;padding:11px;font-weight:700}.pn a.off{opacity:.3;pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .22s;background:#fff;color:#16203a;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #0f1a3544;padding:16px 18px max(18px,env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#sheet.o{transform:none}#sheet .w{font:600 1.5rem var(--serif);display:flex;gap:9px;align-items:center}#sheet .e{color:#0b6b4a;font-weight:800;margin:2px 0}#sheet .p{color:#6b7590;font-size:.9rem}#sheet a{color:#2f6bff;font-weight:800;text-decoration:none;font-size:.9rem;display:inline-block;margin-top:8px;margin-right:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="hero"><div class="hin"><div class="nav"><a href="../index.html">← Startseite</a><a href="../Wortschatz/index.html" style="margin-left:auto">Wortschatz</a><button class="tb" id="th" aria-label="Hell oder dunkel">◐</button></div><h1>Geschichten</h1><p id="sub"></p><div class="bar"><i id="pb"></i></div></div></div>
<main id="m"></main><div id="sheet" role="dialog"></div>
<script src="stories.js"></script>
<script>
const $=s=>document.querySelector(s),M=$('#m'),SH=$('#sheet');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#sub').textContent=S.length+' kleine Geschichten · '+COV+' von '+TOT+' Wörtern schon dabei. Tippe auf ein markiertes Wort für die Bedeutung.';$('#pb').style.width=(100*COV/TOT).toFixed(1)+'%';
const chip=a=>a?`<span class="chip i-${a}">${a}</span>`:'';
const fmt=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
function list(){let h='',last='';S.forEach(s=>{if(s.lv!==last){last=s.lv;h+=`<div class="lv">Stufe ${esc(s.lv)}</div>`}h+=`<a class="card" href="#${s.id}"><b class="n">${esc(s.id.replace(/^S0*/,''))}</b><div><div class="t">${esc(s.t)}</div><div class="s">${esc(s.te)}</div></div><div class="c">${Object.keys(s.w).length} Wörter<br>${s.g.length} Grammatik</div></a>`});M.innerHTML=h;scrollTo(0,0)}
function story(id){const k=S.findIndex(s=>s.id===id);if(k<0)return list();const s=S[k];
 const body=s.s.map(([d,e])=>{const h=esc(d).replace(/\{([^{}|]+)(?:\|([^{}]+))?\}/g,(m,a,l)=>{const lem=(l||a).trim().toLowerCase(),w=s.w[lem]||['','','',''];return `<span class="hw a-${w[0]||'no'}" data-l="${esc(lem)}">${a}</span>`});return `<div class="sn"><div class="de">${h}</div><div class="en">${esc(e)}</div></div>`}).join('');
 const g=s.g.map(([t,x])=>`<div class="g"><b>${esc(t)}</b><p>${fmt(x)}</p></div>`).join('');
 const w=Object.values(s.w).sort((a,b)=>a[1].localeCompare(b[1],'de')).map(x=>`<a class="wi" href="../Wortschatz/index.html?q=${encodeURIComponent(x[1])}">${chip(x[0])}<b>${esc(x[1])}</b><span>${esc(x[2])}</span></a>`).join('');
 const p=S[k-1],n=S[k+1];
 M.innerHTML=`<div class="read"><h2>${esc(s.t)}</h2><p class="te">${esc(s.te)} · Stufe ${esc(s.lv)}</p><div class="tools"><label class="tg"><input type="checkbox" id="en" checked><span></span>Englisch zeigen</label></div><div id="sn">${body}</div></div><h3>Grammatik (auf Englisch)</h3>${g}<h3>Wörter in dieser Geschichte (${Object.keys(s.w).length})</h3><div class="wl">${w}</div><div class="pn"><a class="${p?'':'off'}" href="#${p?p.id:''}">← Zurück</a><a href="#">Alle</a><a class="${n?'':'off'}" href="#${n?n.id:''}">Weiter →</a></div>`;
 $('#en').onchange=e=>$('#sn').classList.toggle('noen',!e.target.checked);
 M.querySelectorAll('.hw').forEach(el=>el.onclick=e=>{e.stopPropagation();M.querySelectorAll('.hw.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');const x=s.w[el.dataset.l];if(!x)return;
  SH.innerHTML=`<div class="w">${chip(x[0])}${esc(x[1])}</div><div class="e">${esc(x[2])}</div>${x[3]?`<div class="p">${x[0]?'Plural: ':''}${esc(x[3])}</div>`:''}<a href="../Wortschatz/index.html?q=${encodeURIComponent(x[1])}">Im Wortschatz ansehen</a><a href="#" id="sp">🔊 Anhören</a>`;SH.classList.add('o');
  $('#sp').onclick=ev=>{ev.preventDefault();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((x[0]?x[0]+' ':'')+x[1]);u.lang='de-DE';speechSynthesis.speak(u)}catch(_){}}});scrollTo(0,0)}
document.addEventListener('click',e=>{if(!e.target.closest('#sheet')&&!e.target.closest('.hw')){SH.classList.remove('o');document.querySelectorAll('.hw.on').forEach(x=>x.classList.remove('on'))}});
function route(){SH.classList.remove('o');const id=location.hash.slice(1);id?story(id):list()}
addEventListener('hashchange',route);route();
$('#th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('wsTheme',n)}catch(e){}};
</script></body></html>
